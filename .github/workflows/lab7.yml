name: Lab 7 Fuzz Tests

on:
  push:
    paths:
      - 'Lab-7/**'
      - '.github/workflows/lab7.yml'
  pull_request:
    paths:
      - 'Lab-7/**'
      - '.github/workflows/lab7.yml'

jobs:
  fuzz-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab-7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run property-based tests
        run: python -m pytest -v test_train_fare.py
